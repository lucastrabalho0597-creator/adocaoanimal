<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tutores - AdoCão</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="../css/estilo.css" rel="stylesheet">
</head>

<body>
    <nav class="navbar navbar-dark bg-dark">
        <div class="container-fluid">
            <button class="navbar-toggler" type="button" data-bs-toggle="offcanvas" data-bs-target="#menuLateral"
                aria-controls="menuLateral" aria-label="Abrir menu">
                <span class="navbar-toggler-icon"></span>
            </button>
            <span class="navbar-brand mb-0 h1 me-auto ms-3">AdoCão</span>
        </div>
    </nav>

    <div class="offcanvas offcanvas-start text-bg-dark" tabindex="-1" id="menuLateral"
        aria-labelledby="menuLateralTitulo">
        <div class="offcanvas-header">
            <h5 class="offcanvas-title" id="menuLateralTitulo">Menu</h5>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas"
                aria-label="Fechar"></button>
        </div>
        <div class="offcanvas-body">
            <ul class="nav nav-pills flex-column">
                <li class="nav-item"><a class="nav-link text-white" href="../adocao.html">Início</a></li>
                <li class="nav-item"><a class="nav-link text-white active" href="tutores.html">Tutores</a></li>
                <li class="nav-item"><a class="nav-link text-white" href="animais.html">Animais</a></li>
                <li class="nav-item"><a class="nav-link text-white" href="agendamentos.html">Agendamentos</a></li>
            </ul>
        </div>
    </div>

    <div class="container mt-5">
        <h1>Tutores</h1>
        <div class="table-responsive">
        <table class="table table-striped table-hover">
            <thead class="table-dark">
                <tr>
                    <th>Nome</th>
                    <th>CPF</th>
                    <th>Endereço</th>
                    <th>Telefone</th>
                    <th>Tipo de Domicílio</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody id="tabela">
            </tbody>
        </table>
        </div>
    </div>

    <div class="container p-4 mt-5 border rounded">
        <form id="formulario">
            <div class="mb-3">
                <label for="id" class="form-label">ID</label>
                <input type="text" class="form-control" id="id" readonly disabled>
            </div>
            <div class="mb-3">
                <label for="nome" class="form-label">Nome</label>
                <input type="text" class="form-control" id="nome" required>
            </div>
            <div class="mb-3">
                <label for="cpf" class="form-label">CPF</label>
                <input type="text" class="form-control" id="cpf" maxlength="14" pattern="[0-9]{11}"
                    title="Digite os 11 números do CPF, sem ponto e sem traço" placeholder="Somente números"
                    oninput="somenteNumeros(this)" required>
            </div>
            <div class="mb-3">
                <label for="endereco" class="form-label">Endereço</label>
                <input type="text" class="form-control" id="endereco" required>
            </div>
            <div class="mb-3">
                <label for="telefone" class="form-label">Telefone</label>
                <input type="text" class="form-control" id="telefone" maxlength="15" pattern="[0-9]{10,11}"
                    title="Digite o DDD e o número, somente números" placeholder="Ex.: 53999999999"
                    oninput="somenteNumeros(this)" required>
            </div>
            <div class="mb-3">
                <label for="tipoDomicilio" class="form-label">Tipo de domicílio</label>
                <select class="form-select" id="tipoDomicilio" required>
                    <option value="">Selecione...</option>
                    <option value="Casa">Casa</option>
                    <option value="Apartamento">Apartamento</option>
                    <option value="Condominio com quintal">Condominio com quintal</option>
                </select>
            </div>
            <button type="button" class="btn btn-primary" onclick="gravarDoForm()">Enviar</button>
            <button type="reset" class="btn btn-warning">Limpar</button>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/storage.js"></script>
    <script src="../js/dadosIniciais.js"></script>
    <script src="../js/repositorio.js"></script>
    <script src="../js/tutores.js"></script>
</body>

</html>
