<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agendamentos - AdoCão</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <nav class="navbar navbar-dark bg-dark">
        <div class="container-fluid">
            <button class="navbar-toggler" type="button"
                    data-bs-toggle="offcanvas" data-bs-target="#menuLateral"
                    aria-controls="menuLateral" aria-label="Abrir menu">
                <span class="navbar-toggler-icon"></span>
            </button>
            <span class="navbar-brand mb-0 h1 me-auto ms-3">AdoCão</span>
        </div>
    </nav>

    <div class="offcanvas offcanvas-start text-bg-dark" tabindex="-1"
         id="menuLateral" aria-labelledby="menuLateralTitulo">
        <div class="offcanvas-header">
            <h5 class="offcanvas-title" id="menuLateralTitulo">Menu</h5>
            <button type="button" class="btn-close btn-close-white"
                    data-bs-dismiss="offcanvas" aria-label="Fechar"></button>
        </div>
        <div class="offcanvas-body">
            <ul class="nav nav-pills flex-column">
                <li class="nav-item"><a class="nav-link text-white" href="../AdoCao.html">Início</a></li>
                <li class="nav-item"><a class="nav-link text-white" href="tutores.html">Tutores</a></li>
                <li class="nav-item"><a class="nav-link text-white" href="animais.html">Animais</a></li>
                <li class="nav-item"><a class="nav-link text-white active" href="agendamentos.html">Agendamentos</a></li>
            </ul>
        </div>
    </div>

    <div class="container mt-5">
        <h1>Agendamentos</h1>
        <table class="table table-striped table-hover">
            <thead class="table-dark">
                <tr>
                    <th>Tutor</th>
                    <th>Animal</th>
                    <th>Data e hora</th>
                    <th>Tipo</th>
                    <th>Status</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody id="tabela">
            </tbody>
        </table>
    </div>

    <div class="container p-4 mt-5 border rounded">
        <form id="formulario">
            <div class="mb-3">
                <label for="id" class="form-label">ID</label>
                <input type="text" class="form-control" id="id" readonly disabled>
            </div>
            <div class="mb-3">
                <label for="tutorId" class="form-label">Tutor</label>
                <select class="form-select" id="tutorId" required>
                </select>
            </div>
            <div class="mb-3">
                <label for="animalId" class="form-label">Animal</label>
                <select class="form-select" id="animalId" required>
                </select>
            </div>
            <div class="mb-3">
                <label for="dataHora" class="form-label">Data e hora</label>
                <input type="datetime-local" class="form-control" id="dataHora" required>
            </div>
            <div class="mb-3">
                <label for="tipo" class="form-label">Tipo</label>
                <select class="form-select" id="tipo" required>
                    <option value="">Selecione...</option>
                    <option value="Visita">Visita</option>
                    <option value="Adoção">Adoção</option>
                    <option value="Acompanhamento">Acompanhamento</option>
                    <option value="Vacinação">Vacinação</option>
                </select>
            </div>
            <div class="mb-3">
                <label for="status" class="form-label">Status</label>
                <select class="form-select" id="status" required>
                    <option value="">Selecione...</option>
                    <option value="Agendado">Agendado</option>
                    <option value="Concluído">Concluído</option>
                    <option value="Cancelado">Cancelado</option>
                </select>
            </div>
            <div class="mb-3">
                <label for="descricao" class="form-label">Descrição</label>
                <textarea class="form-control" id="descricao" rows="3"></textarea>
            </div>

            <button type="button" class="btn btn-primary" onclick="gravarDoForm()">Enviar</button>
            <button type="reset" class="btn btn-warning">Limpar</button>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/storage.js"></script>
    <script src="../js/repositorio.js"></script>
    <script src="../js/agendamentos.js"></script>
</body>

</html>
