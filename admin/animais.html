<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animais - AdoCão</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
        <nav class="navbar navbar-dark bg-dark">
        <div class="container-fluid">
            <button class="navbar-toggler" type="button"
                    data-bs-toggle="offcanvas" data-bs-target="#menuLateral"
                    aria-controls="menuLateral" aria-label="Abrir menu">
                <span class="navbar-toggler-icon"></span>
            </button>
            <span class="navbar-brand mb-0 h1 me-auto ms-3">AdoCão</span>
        </div>
    </nav>

    <div class="offcanvas offcanvas-start text-bg-dark" tabindex="-1"
         id="menuLateral" aria-labelledby="menuLateralTitulo">
        <div class="offcanvas-header">
            <h5 class="offcanvas-title" id="menuLateralTitulo">Menu</h5>
            <button type="button" class="btn-close btn-close-white"
                    data-bs-dismiss="offcanvas" aria-label="Fechar"></button>
        </div>
        <div class="offcanvas-body">
            <ul class="nav nav-pills flex-column">
                <li class="nav-item"><a class="nav-link text-white" href="/adocao.html">Início</a></li>
                <li class="nav-item"><a class="nav-link text-white" href="tutores.html">Tutores</a></li>
                <li class="nav-item"><a class="nav-link text-white" href="animais.html">Animais</a></li>
                <li class="nav-item"><a class="nav-link text-white" href="agendamentos.html">Agendamentos</a></li>
            </ul>
        </div>
    </div>

    <div class="container mt-5">
        <h1>Animais</h1>
        <table class="table table-striped table-hover">
            <thead class="table-dark">
                <tr>
                    <th>Nome</th>
                    <th>Raça</th>
                    <th>Cor</th>
                    <th>Sexo</th>
                    <th>Idade</th>
                    <th>Peso (kg)</th>
                    <th>Vacinado</th>
                    <th>Castrado</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody id="tabela">
            </tbody>
        </table>
    </div>

    <div class="container p-4 mt-5 border rounded">
        <form id="formulario">
            <div class="mb-3">
                <label for="id" class="form-label">ID</label>
                <input type="text" class="form-control" id="id" readonly disabled>
            </div>
            <div class="mb-3">
                <label for="nome" class="form-label">Nome</label>
                <input type="text" class="form-control" id="nome" required>
            </div>
            <div class="mb-3">
                <label for="raca" class="form-label">Raça</label>
                <input type="text" class="form-control" id="raca" required>
            </div>
            <div class="mb-3">
                <label for="cor" class="form-label">Cor</label>
                <input type="text" class="form-control" id="cor" required>
            </div>
            <div class="mb-3">
                <label for="sexo" class="form-label">Sexo</label>
                <select class="form-select" id="sexo" required>
                    <option value="">Selecione...</option>
                    <option value="Macho">Macho</option>
                    <option value="Fêmea">Fêmea</option>
                </select>
            </div>
            <div class="mb-3">
                <label for="idade" class="form-label">Idade (anos)</label>
                <input type="number" class="form-control" id="idade" required>
            </div>
            <div class="mb-3">
                <label for="peso" class="form-label">Peso (kg)</label>
                <input type="number" step="0.1" class="form-control" id="peso" required>
            </div>
            <div class="mb-3">
                <label for="dataRegistro" class="form-label">Data de registro</label>
                <input type="date" class="form-control" id="dataRegistro" required>
            </div>
            <div class="mb-3">
                <label for="motivoResgate" class="form-label">Motivo do resgate</label>
                <input type="text" class="form-control" id="motivoResgate" required>
            </div>
            <div class="form-check mb-3">
                <input class="form-check-input" type="checkbox" id="vacinado">
                <label class="form-check-label" for="vacinado">Vacinado</label>
            </div>
            <div class="form-check mb-3">
                <input class="form-check-input" type="checkbox" id="castrado">
                <label class="form-check-label" for="castrado">Castrado</label>
            </div>

            <button type="button" class="btn btn-primary" onclick="gravarDoForm()">Enviar</button>
            <button type="reset" class="btn btn-warning">Limpar</button>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/storage.js"></script>
    <script src="../js/repositorio.js"></script>
    <script src="../js/animais.js"></script>
</body>

</html>
